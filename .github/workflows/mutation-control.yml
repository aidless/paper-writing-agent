name: mutation-control

# 反向证明: 故意注入一个确定失败的变异, 断言 ci.yml 里的真门真的返回非零。
# 目的不是抓 bug, 而是抓"假绿门"——CI 里 `|| true` / `|| echo` / 删检查让门变安静。
#
# 真门 = ci.yml:54-55 "Selftests (C3)" 用的同一个命令:
#     python scripts/run_ci.py --only C1,C3,C4,C6,C7,C8,C9,C10
# run_ci.py 在任何一项 FAIL 时返回 1 (run_ci.py:216-219)。
# 这覆盖了 ci.yml 里 C1/C3/C4/C6/C7/C8/C9/C10 全部判据 (ci.yml:40-73)。
#
# 变异选在 C8 (judge output validator): 把 validate_judge_output.py 的返回值
# 从 "VALID->0 / INVALID->1" 反过来。语义等价于"校验器开始给无效输出放行"——
# 正是本仓最在意的那种静默失真 (invalid judge output 必须留在分母里,
# 见 validate_judge_output.py:13-14 的模块 docstring)。
# stdlib-only: 变异只用字节替换, 不需要装任何新包; run_ci.py 自身也只依赖 stdlib
# (C7 里的 scipy 是 requirements.txt 里本来就有的)。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Purge every bytecode cache in the tree
        # 缓存陷阱不是 boilerplate, 见下面 assert 步骤的长注释。
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name '*.py[co]' -delete 2>/dev/null || true
          find . -type d -name .pytest_cache -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Fail-closed baseline — assert the real gate is green before mutating
        # 变异结果只有在干净树基线通过时才有意义。基线红了立刻退出。
        run: |
          set -euo pipefail
          set +e
          python scripts/run_ci.py --only C1,C3,C4,C6,C7,C8,C9,C10
          rc=$?
          set -e
          echo "baseline exit=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Baseline red, mutation meaningless::run_ci.py exited $rc on a clean tree. Fix ci.yml's real gate first; a failing mutation proves nothing here."
            exit 1
          fi

      - name: Inject deterministic mutation into the judge-output validator
        # 变异: 把 "VALID->0 / INVALID->1" 反成 "VALID->1 / INVALID->0"。
        # 字节长度完全相同 (7272 == 7272), 这是故意的: .pyc 头里同时存了 mtime
        # 和 size, 只有 size 也变了才可能靠 size 察觉。详见下面 assert 步骤。
        # 完全可逆: 纯字节替换, 无时间/随机/网络依赖, 结束后 git checkout 还原。
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          p = pathlib.Path("scripts/validate_judge_output.py")
          orig = p.read_bytes()
          anchor = b'    return 0 if status == "VALID" else 1\n'
          if orig.count(anchor) != 1:
              raise SystemExit(
                  f"::error::mutation anchor found {orig.count(anchor)} times (expected 1) -- "
                  "scripts/validate_judge_output.py has drifted. Re-derive the mutation; "
                  "do NOT silently skip."
              )
          mut = orig.replace(anchor, b'    return 1 if status == "VALID" else 0\n')
          if len(mut) != len(orig):
              raise SystemExit("::error::mutation is no longer byte-length-identical")
          p.write_bytes(mut)
          print(f"injected: {len(orig)} -> {len(mut)} bytes (identical length, C8 exit codes inverted)")
          PY

      - name: Assert the real gate returns NON-ZERO on the mutated tree
        # 缓存陷阱 (本 job 的核心):
        # CPython 的 .pyc 头记录源文件的 mtime(秒级)和 size。干净 checkout 后
        # __pycache__ 不存在, 但基线那一步的 run_ci.py 会跑 C1 (py_compile),
        # 生成 scripts/__pycache__; 若注入变异的动作与 .pyc 的 mtime 落在同一秒,
        # 且长度未变, 解释器会直接复用旧 .pyc, 变异对门完全不可见。
        # 所以注入之后必须清缓存, 再跑门。
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name '*.py[co]' -delete 2>/dev/null || true

          set +e
          python scripts/run_ci.py --only C1,C3,C4,C6,C7,C8,C9,C10
          rc=$?
          set -e
          echo "mutated exit=$rc"

          if [ "$rc" -eq 0 ]; then
            echo "::error title=Mutation not detected::run_ci.py exited 0 on a mutated tree. The gate is fake-green (a swallowed \`|| true\`, a deleted C-check, or a narrowed \`--only\` list). This is exactly the failure mode this job exists to catch."
            exit 1
          fi
          if [ "$rc" -gt 128 ]; then
            echo "::error title=Suspicious exit code::$rc looks like a signal (128+n), not a check failure. A SIGPIPE from \`grep -q\`/\`head -N\` in the gate would do this."
            exit 1
          fi
          echo "real gate returned $rc as required"

      - name: Reverse sanity control — the same assertion must reject a swallowed gate
        # 反向对照: 门换成吞错误版 (`|| true`), 断言逻辑仍必须抓到它。
        # 若这一步反而绿了, 说明 mutation-control 自己没牙。
        run: |
          set -euo pipefail

          # 吞错误版: 退出码被 || true 吃掉, 一定是 0
          set +e
          python scripts/run_ci.py --only C1,C3,C4,C6,C7,C8,C9,C10 > /tmp/swallowed.log 2>&1 || true
          swallowed_rc=$?
          set -e
          echo "swallowed gate exit=$swallowed_rc"

          if [ "$swallowed_rc" -ne 0 ]; then
            echo "::error::swallowed gate returned $swallowed_rc; the reverse control is not exercising what it claims"
            exit 1
          fi

          # 把这个 0 喂给与上面完全相同的判据
          rc="$swallowed_rc"
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=reverse control::swallowed gate returns 0 on the mutated tree, i.e. it WOULD have gone green in CI. Our assertion rejects 0, so this job would go red. Teeth confirmed."
            exit 0
          fi
          echo "::error::assertion accepted a zero exit code"
          exit 1

      - name: Restore the tree and assert the gate is green again
        run: |
          set -euo pipefail
          git checkout -- scripts/validate_judge_output.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name '*.py[co]' -delete 2>/dev/null || true

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree not clean after restore"
            git status --porcelain
            exit 1
          fi

          set +e
          python scripts/run_ci.py --only C1,C3,C4,C6,C7,C8,C9,C10
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::gate still red after restore (rc=$rc); the mutation was not fully reversible"
            exit 1
          fi
          echo "mutation-control: baseline=0 mutation=nonzero reverse-control=caught restored=$rc"
