name: paper-writing-agent CI

# Push to main and every pull request.
# offline-regression: no TeX, no requirements.txt (the fresh-clone path).
# tex-gates: TeX only, --fail-on-skip.
# verify: requirements.txt + TeX + run_ci.py. See .github/CI_README.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install TeX (dynamic compile layer for compile-gate)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-bibtex-extra
          pdflatex --version | head -1

      - name: Compile all scripts (C1)
        run: python -m py_compile scripts/*.py

      - name: CLI --help smoke (C2)
        run: |
          set -e
          for f in scripts/*.py; do
            base=$(basename "$f")
            case "$base" in
              test_pyramid.py|test_evidence_protection.py) continue ;;  # integration-only
            esac
            python "$f" --help > /dev/null 2>&1
          done

      - name: Selftests and non-TeX checks
        # C4 inside run_ci.py allows SKIP. The next step repeats the regression
        # with --fail-on-skip because this job has TeX installed.
        run: python scripts/run_ci.py --only C1,C3,C4,C6,C7,C8,C9,C10,C11,C12,C13

      - name: Scanner regression (C4, TeX installed — SKIP is a failure)
        run: python scripts/scanner_regression.py --fail-on-skip

      - name: Power analysis textbook check (C6)
        run: python scripts/power_analysis.py --selftest

      - name: Stats vs scipy cross-check (C7)
        run: python scripts/run_ci.py --only C7

      - name: Judge output validator (C8)
        run: python scripts/run_ci.py --only C8

      - name: Experiment plan dry-run (C9)
        run: python scripts/run_ci.py --only C9

      - name: Experiment suggestion mapping (C10)
        run: python scripts/run_ci.py --only C10

  offline-regression:
    # No TeX and no requirements.txt. This is the fresh-clone path (`make regression`
    # plus drift tests). Two compile-gate fixtures SKIP here; that is not a pass,
    # and the summary must say so. The tex-gates job is what fails on SKIP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Offline scanner regression
        run: python scripts/scanner_regression.py

      - name: Inventory drift (stdlib unittest, no pytest)
        run: python -m unittest tests.test_inventory_drift -v

  tex-gates:
    # TeX-only. Does not install the scientific stack. --fail-on-skip means a
    # broken TeX install cannot be reported as a green compile-gate run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-bibtex-extra
          pdflatex --version | head -1

      - name: compile-gate fixtures (fail if any SKIP)
        run: python scripts/scanner_regression.py --family compile-gate --fail-on-skip

  secret-scan:
    # Full history: a key leaked in an old commit is still a live key. The CLI is
    # used rather than gitleaks-action, which needs GITHUB_TOKEN to scan pull
    # requests and so turns every Dependabot PR red for an unrelated reason --
    # and a PR runs the workflow from its own branch, so a fix on main does not
    # take effect until the branch is regenerated. Pinned, not latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
